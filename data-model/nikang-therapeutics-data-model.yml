note: >-
  The entity graph of the NiKang Therapeutics content API. Identifiers are bare integers — there are no
  prefixed or typed ids on this surface, so an id is only meaningful together with the collection it
  came from. Relationship traversal is via `_links` (HAL-ish rel names) or by re-querying with the
  `include` parameter; there is no server-side join beyond `_embed`.
id_scheme:
  format: integer
  prefixed: false
  scope: >-
    Post-like ids (posts, pages, media, dt_team) share one auto-increment sequence, so an id is unique
    across those four collections. Term ids (categories, tags, dt_team_category) are a separate
    sequence and can collide numerically with post-like ids.
  detail: >-
    Observed live: post 1004, page 638, media 1025, dt_team 490, category 13, dt_team_category 10.
entities:
- name: Post
  collection: /wp/v2/posts
  count_at_harvest: 16
  description: A news post — press release, clinical data announcement or scientific presentation.
  key_fields: [id, slug, title.rendered, content.rendered, excerpt.rendered, date_gmt, modified_gmt, link, status, author, categories, tags, featured_media]
- name: Page
  collection: /wp/v2/pages
  count_at_harvest: 9
  description: A corporate page — about us, science and pipeline, news, careers, jobs, privacy, terms.
  key_fields: [id, slug, title.rendered, content.rendered, parent, menu_order, link, modified_gmt]
- name: TeamMember
  collection: /wp/v2/dt_team
