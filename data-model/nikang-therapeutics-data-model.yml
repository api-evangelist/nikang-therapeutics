traversal:
  embed: >-
    `_embed` inlines author, wp:featuredmedia and wp:term into an `_embedded` object on the same
    response, collapsing three round trips into one. This is the only server-side join available.
  links: >-
    Every object carries `_links` with self, collection, about, replies, wp:attachment,
    wp:featuredmedia, wp:term and curies. Posts additionally carry author and version-history.
  no_graphql: No GraphQL endpoint is exposed — /graphql 404s on both hosts.
