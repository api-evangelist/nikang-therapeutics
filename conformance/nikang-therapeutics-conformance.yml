    /wp-json index reports an empty `authentication` array.
- id: oidc
  name: OpenID Connect
  conforms: false
  evidence: '/.well-known/openid-configuration returned 404 on both hosts on 2026-08-26.'
- id: scim
  name: SCIM 2.0
  conforms: false
  evidence: No urn:ietf:params:scim:schemas URN and no /scim/v2 route in the 210-route index.
- id: odata
  name: OData
  conforms: false
  evidence: No $metadata surface and no OData query conventions in the route index.
- id: json-api
  name: JSON:API
  conforms: false
  evidence: >-
    Responses are bare JSON objects/arrays with a WordPress `_links` block, not a JSON:API
