aid: nikang-therapeutics
name: NiKang Therapeutics
description: >-
  NiKang Therapeutics is a clinical-stage biotechnology company headquartered at 200 Powder Mill Road,
  Building E500, Wilmington, Delaware, founded in 2017 to discover and develop innovative small molecule
  medicines that help patients fight cancer. The company works from deep insights into disease biology and
  molecular pathways and applies structure-based drug design to targets long considered difficult to drug,
  spanning both inhibitor and targeted-protein-degradation modalities. Its lead programme, NKT2152, is an
  orally bioavailable allosteric HIF2alpha inhibitor in Phase 1/2 for clear cell renal cell carcinoma, VHL
  disease and other solid tumours; NKT3964 is a first-in-class selective CDK2 degrader in Phase 1 for advanced
  or metastatic solid tumours; NKT5097 is a first-in-class dual CDK2/4 degrader, also in Phase 1; and a KRAS
  G12D small molecule programme sits in discovery and IND-enabling work. NiKang raised a $10 million Series A
  in December 2017, a $50 million Series B in September 2020 and a $200 million Series C in May 2021, and has
  partnered its chemistry with Erasca on SHP2 and with Pfizer, Hansoh and Roche on HIF2. NiKang Therapeutics
  runs no developer program and publishes no product API, developer portal, API reference or machine-readable
  specification of its own. The only machine-readable surface reachable without credentials is the WordPress
  REST content API behind www.nikangtx.com, which is catalogued here — 210 registered routes across 17
  namespaces, of which the anonymously readable read-only content families are described in openapi/.
